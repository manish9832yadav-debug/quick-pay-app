<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Pay - Deposit INR</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}

.top{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.back{
  border:0;
  background:white;
  border-radius:10px;
  padding:10px 14px;
  font-size:20px;
}

.title{
  font-size:23px;
  font-weight:bold;
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.amount{
  font-size:30px;
  font-weight:bold;
  color:#1769ff;
  margin:8px 0 20px;
}

.bank{
  background:#f4f7ff;
  padding:15px;
  border-radius:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #e5e7eb;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#777;
}

.value{
  font-weight:bold;
  text-align:right;
  word-break:break-all;
}

.copy{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#1769ff;
  color:white;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-top:8px;
}

.submit{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#1769ff;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.note{
  color:#777;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <button class="back" onclick="history.back()">‹</button>
    <div class="title">Deposit INR</div>
  </div>

  <div class="card">

    <div>Amount to Pay</div>

    <div class="amount" id="amount">
      ₹1,000.00
    </div>

    <div class="bank">

      <div class="row">
        <span class="label">Bank Name</span>
        <span class="value">YOUR BANK</span>
      </div>

      <div class="row">
        <span class="label">Account Holder</span>
        <span class="value">YOUR NAME</span>
      </div>

      <div class="row">
        <span class="label">Account Number</span>
        <span class="value">XXXXXXXXXXXX</span>
      </div>

      <div class="row">
        <span class="label">IFSC</span>
        <span class="value">XXXXXXXXXXX</span>
      </div>

    </div>

    <button class="copy" onclick="copyDetails()">
      Copy Bank Details
    </button>

  </div>


  <div class="card">

    <h3>After Payment</h3>

    <p class="note">
      Bank transfer complete karne ke baad apna UTR /
      transaction reference number yahan submit karein.
    </p>

    <label>UTR / Transaction ID</label>

    <input
      id="utr"
      type="text"
      placeholder="Enter UTR / transaction ID"
    >

    <button class="submit" onclick="submitPayment()">
      Submit Payment
    </button>

  </div>

</div>

<script>

function copyDetails(){

  const details =
    "Bank: YOUR BANK\n" +
    "Account Holder: YOUR NAME\n" +
    "Account Number: XXXXXXXXXXXX\n" +
    "IFSC: XXXXXXXXXXX";

  if(navigator.clipboard){
    navigator.clipboard.writeText(details);
  }

  alert("Bank details copied");
}

function submitPayment(){

  const utr =
    document.getElementById("utr").value.trim();

  if(!utr){
    alert("Please enter UTR / Transaction ID");
    return;
  }

  alert(
    "Payment submitted for verification.\n\n" +
    "Status: Pending"
  );

  window.location.href="orders.html";
}

</script>

</body>
</html>
