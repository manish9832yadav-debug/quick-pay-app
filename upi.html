<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Pay - UPI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}

h1{
  margin:10px 0 6px;
}

.subtitle{
  color:#777;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#1769ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.upi{
  background:#f4f7ff;
  padding:15px;
  border-radius:14px;
  margin-top:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
}

.verified{
  color:#16834b;
  font-weight:bold;
}

.note{
  color:#777;
  font-size:13px;
  line-height:1.5;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="app">

<h1>💳 UPI</h1>
<div class="subtitle">Manage your demo payment details</div>

<div class="card">

  <label>UPI ID</label>

  <input
    id="upi"
    type="text"
    placeholder="example@upi"
  >

  <button onclick="verifyUPI()">
    Verify UPI ID
  </button>

  <div class="upi">

    <div class="row">
      <span>Current UPI</span>
      <b id="current">Not Added</b>
    </div>

    <div class="row">
      <span>Status</span>
      <span id="status">Not Verified</span>
    </div>

  </div>

  <p class="note">
    This is a demo UPI screen. It does not send or receive real
    money and does not verify an actual bank account.
  </p>

</div>

</div>

<script>

function verifyUPI(){

  const upi =
    document.getElementById("upi").value.trim();

  if(!upi){
    alert("Please enter a UPI ID");
    return;
  }

  document.getElementById("current").innerText = upi;

  document.getElementById("status").innerHTML =
    '<span class="verified">Demo Verified ✓</span>';

  alert("Demo UPI ID saved");
}

</script>

</body>
</html>
