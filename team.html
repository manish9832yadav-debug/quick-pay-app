<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Pay - Team</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:430px;margin:auto;min-height:100vh;padding:20px}
h1{margin:10px 0 6px}
.subtitle{color:#777;margin-bottom:20px}
.card{
  background:white;padding:20px;border-radius:20px;
  margin-bottom:15px;box-shadow:0 5px 20px rgba(0,0,0,.08)
}
.code{
  background:#eef4ff;padding:16px;border-radius:14px;
  display:flex;justify-content:space-between;align-items:center
}
.code b{color:#1769ff;font-size:18px}
button{
  border:0;border-radius:11px;padding:12px 16px;
  background:#1769ff;color:white;font-weight:bold
}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#f5f7fb;padding:16px;border-radius:14px}
.number{font-size:24px;font-weight:bold;margin-top:5px}
.row{
  display:flex;justify-content:space-between;
  padding:13px 0;border-bottom:1px solid #eee
}
.row:last-child{border:0}
.note{color:#777;font-size:13px;line-height:1.5}
</style>
</head>

<body>

<div class="app">

<h1>👥 My Team</h1>
<div class="subtitle">Invite friends and track your demo team</div>

<div class="card">
  <h3>Your Referral Code</h3>

  <div class="code">
    <b id="ref">QP2026</b>
    <button onclick="copyCode()">Copy</button>
  </div>
</div>

<div class="card">

  <div class="stats">
    <div class="stat">
      <div>Team Members</div>
      <div class="number">12</div>
    </div>

    <div class="stat">
      <div>Demo Rewards</div>
      <div class="number">₹500</div>
    </div>
  </div>

</div>

<div class="card">

<h3>Recent Members</h3>

<div class="row">
  <span>Member 01</span>
  <b>Active</b>
</div>

<div class="row">
  <span>Member 02</span>
  <b>Active</b>
</div>

<div class="row">
  <span>Member 03</span>
  <b>Pending</b>
</div>

</div>

<div class="card">
  <p class="note">
    This is a demo referral section. Rewards shown here are virtual
    and have no cash value.
  </p>
</div>

</div>

<script>
function copyCode(){
  const code=document.getElementById("ref").innerText;

  if(navigator.clipboard){
    navigator.clipboard.writeText(code);
  }

  alert("Referral code copied: " + code);
}
</script>

</body>
</html>
