<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Pay - OTP</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7ff;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px 24px;
  border-radius:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  color:#1769ff;
  font-size:30px;
  font-weight:bold;
}

.title{
  text-align:center;
  font-size:24px;
  margin-top:28px;
}

.text{
  text-align:center;
  color:#777;
  line-height:1.5;
}

.otp{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:25px 0;
}

.otp input{
  width:45px;
  height:52px;
  text-align:center;
  font-size:22px;
  border:1px solid #ddd;
  border-radius:10px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#1769ff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.resend{
  text-align:center;
  margin-top:18px;
  color:#1769ff;
}

.secure{
  text-align:center;
  margin-top:22px;
  color:#888;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">QUICK PAY</div>

    <div class="title">Enter OTP</div>

    <p class="text">
      We sent a 6-digit verification code<br>
      to your mobile number.
    </p>

    <div class="otp">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
      <input maxlength="1">
    </div>

    <button onclick="verifyOTP()">
      Verify OTP
    </button>

    <div class="resend">
      Resend OTP
    </div>

    <div class="secure">
      🔒 Secure verification
    </div>

  </div>

</div>

<script>
function verifyOTP(){
  alert("Demo OTP verified!");
}
</script>

</body>
</html>
