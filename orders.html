<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Pay - Transactions</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}

.top{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.back{
  border:0;
  background:white;
  border-radius:10px;
  padding:10px 14px;
  font-size:20px;
}

h1{
  margin:0;
  font-size:23px;
}

.card{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.toprow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.type{
  color:#1769ff;
  font-weight:bold;
}

.amount{
  font-size:25px;
  font-weight:bold;
  margin:12px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  color:#777;
}

.value{
  color:#172033;
  font-weight:bold;
  text-align:right;
  word-break:break-all;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:7px 11px;
  border-radius:20px;
  background:#fff3cd;
  color:#9a6b00;
  font-size:13px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <button class="back" onclick="history.back()">‹</button>
    <h1>Transactions</h1>
  </div>

  <div id="transactions"></div>

</div>

<script>

function loadTransactions(){

  const box =
    document.getElementById("transactions");

  const transactions =
    JSON.parse(
      localStorage.getItem("transactions") || "[]"
    );

  if(transactions.length === 0){

    box.innerHTML = `
      <div class="card empty">
        No transactions yet
      </div>
    `;

    return;
  }

  box.innerHTML = "";

  transactions.forEach(function(tx){

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="toprow">
        <div class="type">💰 ${tx.type}</div>
        <div>${tx.id}</div>
      </div>

      <div class="amount">
        ₹${Number(tx.amount).toFixed(2)}
      </div>

      <div class="row">
        <span>Method</span>
        <span class="value">${tx.method}</span>
      </div>

      <div class="row">
        <span>UTR</span>
        <span class="value">${tx.utr}</span>
      </div>

      <div class="row">
        <span>Date</span>
        <span class="value">${tx.date}</span>
      </div>

      <span class="status">
        ${tx.status}
      </span>
    `;

    box.appendChild(card);

  });

}

loadTransactions();

</script>

</body>
</html>
